# Static host for the Godot web export.
#
# Two things this has to get right, both of which a default nginx gets wrong:
#
#  1. `.wasm` and `.pck` MIME types. WebAssembly.instantiateStreaming refuses
#     anything that is not `application/wasm`, and Godot's pack loader is
#     unhappy with `.pck` served as HTML.
#  2. Pre-compressed assets. Only the `.gz` files are in the repo (see
#     build.sh), so `gzip_static always` has to serve them without an
#     uncompressed original on disk, and `gunzip on` covers the rare client
#     that will not take gzip.
#
# The cross-origin isolation headers this page needs (COOP/COEP, for
# SharedArrayBuffer) are *not* here - they are set by Caddy from the repo's
# headers.caddy, so there is one place that owns them and no chance of the two
# layers disagreeing.

types {
    application/wasm                      wasm;
    application/octet-stream              pck;
    text/javascript                       js;
    image/svg+xml                         svg;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip_static always;
    gunzip on;
    # Caddy fronts this container and stamps every request with `Via: 1.1
    # Caddy`. nginx's default `gzip_proxied off` reads a Via header as "someone
    # else may cache this" and declines to serve the compressed variant at all -
    # which silently turned a 10 MB gzipped .wasm back into a 38 MB one on the
    # wire, with no error anywhere to say so.
    gzip_proxied any;

    # the engine build and the pack are rewritten on every deploy and are
    # fetched once per visit; the shell must not be cached or a deploy is
    # invisible until the browser gives up on it
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location ~* \.(wasm|pck|js|png|svg)$ {
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
